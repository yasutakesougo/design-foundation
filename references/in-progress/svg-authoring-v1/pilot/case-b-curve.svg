  </g>

  <g transform="translate(315,50)">
    <path class="p" d="M25 180 C85 45 180 45 245 80"/>
    <text class="s" x="20" y="225">smooth but over-regularized</text>
  </g>

  <g transform="translate(620,50)">
    <path class="p" d="M25 180 C70 70 118 72 150 135 C162 159 198 96 245 80"/>
    <circle class="a" cx="150" cy="135" r="5"/>

    <text x="84" y="352" font-size="19" fill="#24352F">すでにある日常の見方を拾う。</text>
  </g>

  <g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" fill="#234B3E">

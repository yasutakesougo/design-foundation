<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123">
  <rect width="794" height="1123" fill="#F8F6F0"/>
  <g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" fill="#24483D">
    <text x="397" y="132" text-anchor="middle" font-size="22" font-weight="600">広報部会</text>
    <text x="397" y="196" text-anchor="middle" font-size="40" font-weight="700">障害福祉の日常を、</text>
    <text x="397" y="246" text-anchor="middle" font-size="40" font-weight="700">社会に翻訳する。</text>
    <rect x="290" y="267" width="214" height="8" rx="4" fill="#D8BE62"/>
    <text x="397" y="334" text-anchor="middle" font-size="19" fill="#334A43">広報のために特別な出来事を増やすのではなく、</text>
    <text x="397" y="365" text-anchor="middle" font-size="19" fill="#334A43">すでにある日常の見方を拾う。</text>
  </g>

  <g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif">
    <rect x="105" y="438" width="584" height="120" rx="18" fill="#EEF2EB" stroke="#D9E2DB"/>
    <text x="397" y="510" text-anchor="middle" font-size="28" font-weight="700" fill="#24483D">待った3分</text>

    <rect x="105" y="591" width="584" height="120" rx="18" fill="#EEF2EB" stroke="#D9E2DB"/>
    <text x="397" y="663" text-anchor="middle" font-size="28" font-weight="700" fill="#24483D">今日は声をかけなかった</text>

    <rect x="105" y="744" width="584" height="120" rx="18" fill="#EEF2EB" stroke="#D9E2DB"/>
    <text x="397" y="816" text-anchor="middle" font-size="28" font-weight="700" fill="#24483D">いつもの場所</text>
  </g>

  <line x1="170" y1="921" x2="624" y2="921" stroke="#D8BE62" stroke-width="3"/>
  <g font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" fill="#334A43" text-anchor="middle">
    <text x="397" y="974" font-size="21" font-weight="600">必要なものだけ、少し先を考える。</text>
    <text x="397" y="1010" font-size="21">何もしないことも判断です。</text>
  </g>
  <text x="397" y="1072" text-anchor="middle" font-family="Noto Sans CJK JP, Noto Sans JP, Hiragino Sans, Yu Gothic, sans-serif" font-size="14" fill="#66756F">比較用 Draft A｜Human brief + Foundation only</text>
</svg>